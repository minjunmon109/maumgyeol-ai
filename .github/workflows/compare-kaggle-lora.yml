name: Compare Qwen base vs 20-step Kaggle LoRA (experimental NO DEPLOY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compare-kaggle-lora.yml
      - training/compare_gpu_lora.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.51,<5' peft accelerate safetensors
      - name: Retrieve ACTUAL completed 20-step GPU LoRA adapter
        uses: actions/download-artifact@v4
        with:
          run-id: 40996444103
          github-token: ${{ github.token }}
          name: maumgyeol-kaggle-gpu-experimental-NOT-SAFETY-APPROVED
          path: gpu_artifact
      - name: Compare same real generated replies, automatic checks only
        run: |
          python -u training/compare_gpu_lora.py --artifact gpu_artifact --output comparison_result --max-new-tokens 96
      - name: Keep comparison evidence private to workflow artifacts, NOT DEPLOY
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-vs-gpu20step-lora-actual-response-comparison
          path: comparison_result/
          retention-days: 7
          if-no-files-found: warn
