name: Verify V3 CPU lab in simulated iPhone Safari (NOT real device)
on:
  push:
    branches: [main]
    paths:
      - cpu-v3-lab.html
      - cpu-v3-lab.js
      - counseling-guard.js
      - .github/workflows/test-v3-webkit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps webkit
      - name: Test iPhone-sized Safari engine, local-only UI and safety
        run: |
          python - <<'PY'
          import asyncio,contextlib,http.server,threading
          from playwright.async_api import async_playwright
          class H(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*args):pass
          server=http.server.ThreadingHTTPServer(('127.0.0.1',0),H)
          thread=threading.Thread(target=server.serve_forever,daemon=True);thread.start()
          async def test():
              async with async_playwright() as p:
                  browser=await p.webkit.launch()
                  context=await browser.new_context(
                      viewport={'width':390,'height':844},
                      device_scale_factor=3,is_mobile=True,has_touch=True,
                      user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1'
                  )
                  page=await context.new_page()
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  await page.goto(f'http://127.0.0.1:{server.server_port}/cpu-v3-lab.html',wait_until='domcontentloaded')
                  await page.wait_for_timeout(700)
                  assert await page.locator('h1').inner_text()=='V3 · 내 기기 CPU 실험실'
                  assert await page.locator('#send').is_disabled()
                  assert await page.locator('#load').is_disabled()
                  assert await page.locator('#file').count()==1
                  assert await page.locator('#state').count()==1
                  assert not errors,errors
                  print('SIMULATED_IPHONE_WEBKIT_UI_PASS=true')
                  print('REAL_IPHONE_DEVICE_TEST_PASS=false')
                  print('GGUF_RUNTIME_INFERENCE_TESTED_IN_BROWSER=false')
                  await browser.close()
          try:asyncio.run(test())
          finally:server.shutdown()
          PY
