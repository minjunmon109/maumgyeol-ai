name: Fast KMI LoRA CPU pilot - experimental only
on:
  push:
    branches:
      - experiment/hybrid-counseling-safety-20261030
    paths:
      - .github/workflows/kmi-lora-fast-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  faster-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 'Gate - authorized training data and separate validation'
        run: |
          python training/verify_training_license.py
          python training/train_cpu_lora.py --train 'training/open_data/kmi_train_*.jsonl' --val training/open_data/kmi_val.jsonl --dry-run
      - name: Install CPU trainer
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.51,<5' peft accelerate safetensors
      - name: Fast 20-step CPU pilot with one microbatch per optimizer step
        run: |
          python -u training/train_cpu_lora.py --train 'training/open_data/kmi_train_*.jsonl' --val training/open_data/kmi_val.jsonl --max-steps 20 --gradient-accumulation-steps 1 --max-length 128 --max-training-examples 64 --max-eval-examples 8 --output experimental-kmi-fast-lora
      - name: Confirm only experimental outputs; prohibit deployment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('experimental-kmi-fast-lora/training_manifest.json').read_text())
          assert manifest['steps']==20 and manifest['gradient_accumulation_steps']==1
          assert manifest['approved_for_release'] is False
          assert manifest['clinician_reviewed'] is False
          print('Experiment trained; deployment unapproved')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kmi-faster-20step-experimental-NOT-APPROVED
          path: experimental-kmi-fast-lora/
          if-no-files-found: warn
          retention-days: 7
