name: Maumgyeol real CPU LoRA training
on:
  push:
    paths:
      - '.github/workflows/cpu-finetune.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  cpu-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HOME: /tmp/maumgyeol-hf
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect CPU and memory
        run: free -h
      - name: Install CPU training environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r training/requirements-cpu.txt
      - name: Prepare KMI research examples
        run: python training/cpu_subset.py --train-count 32 --val-count 8
      - name: Validate KMI data
        run: python training/train_cpu_lora.py --train training/data/cpu-trial/train.jsonl --val training/data/cpu-trial/val.jsonl --dry-run
      - name: Run real CPU LoRA training
        run: python -u training/train_cpu_lora.py --train training/data/cpu-trial/train.jsonl --val training/data/cpu-trial/val.jsonl --output training/outputs/qwen25-1.5b-cpu-trial --max-steps 6 --max-length 112
      - name: Verify actual trained adapter and finite losses
        run: python training/verify_cpu_training.py --output training/outputs/qwen25-1.5b-cpu-trial --expected-steps 6
      - name: Save trained adapter artifact
        uses: actions/upload-artifact@v4
        with:
          name: maumgyeol-qwen25-1p5b-real-cpu-lora-trial
          path: training/outputs/qwen25-1.5b-cpu-trial/
          retention-days: 14
          if-no-files-found: error
