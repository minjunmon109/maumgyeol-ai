name: Hybrid 30-case comparative evaluation (NO DEPLOY)
on:
  push:
    branches:
      - experiment/hybrid-counseling-safety-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        model: [baseline, mobile, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python scripts and 30 cases without model downloads
        run: |
          python -m py_compile training/hybrid_safety_eval.py training/run_hybrid_candidates.py
          python -c 'import json,pathlib; a=[json.loads(x) for x in pathlib.Path("training/hybrid_cases.jsonl").read_text().splitlines() if x.strip()]; assert len(a)==30; assert len({x["case_id"] for x in a})==30; print("VALIDATED 30 synthetic cases")'
      - name: Install CPU model inference
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.51,<5" accelerate safetensors
      - name: Generate real answers to all 30 synthetic counseling cases
        run: |
          python -u training/run_hybrid_candidates.py --model "${{ matrix.model }}" --output "${{ matrix.model }}.jsonl" --max-new-tokens 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-${{ matrix.model }}-30cases
          path: ${{ matrix.model }}.jsonl
          if-no-files-found: warn
          retention-days: 7
  compare:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hybrid-*-30cases
          merge-multiple: true
          path: evidence
      - name: Automated 30-case safety screening and comparison
        run: |
          python training/hybrid_safety_eval.py --baseline evidence/baseline.jsonl --mobile evidence/mobile.jsonl --server evidence/server.jsonl --output evidence/comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-30case-comparison-NOT-CLINICALLY-APPROVED
          path: evidence/comparison.json
          if-no-files-found: warn
          retention-days: 30
