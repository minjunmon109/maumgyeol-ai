name: Hybrid experiment smoke test
on:
  push:
    branches:
      - experiment/hybrid-counseling-safety-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        model: [baseline, mobile, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python scripts and 30 cases without model downloads
        run: |
          python -m py_compile training/hybrid_safety_eval.py training/run_hybrid_candidates.py
          python -c 'import json,pathlib; a=[json.loads(x) for x in pathlib.Path("training/hybrid_cases.jsonl").read_text().splitlines() if x.strip()]; assert len(a)==30; assert len({x["case_id"] for x in a})==30; print("VALIDATED 30 synthetic cases")'
      - name: Install CPU model inference
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.51,<5" accelerate safetensors
      - name: Run real candidate on first three synthetic cases
        run: |
          head -n 3 training/hybrid_cases.jsonl > /tmp/hybrid-small.jsonl
          python -u training/run_hybrid_candidates.py --model "${{ matrix.model }}" --cases /tmp/hybrid-small.jsonl --output "${{ matrix.model }}-smoke.jsonl" --max-new-tokens 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-${{ matrix.model }}-smoke-NOT-CLINICAL
          path: ${{ matrix.model }}-smoke.jsonl
          if-no-files-found: warn
          retention-days: 7
