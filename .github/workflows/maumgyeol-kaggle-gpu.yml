name: Maumgyeol free Kaggle GPU LoRA pilot (manual, NO DEPLOY)
on:
  push:
    branches: [main]
    paths:
      - training/kaggle_gpu_pilot.py
  workflow_dispatch:
    inputs:
      kaggle_profile:
        description: 'Kaggle username or profile URL (not display name, email or token)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: maumgyeol-kaggle-gpu
  cancel-in-progress: true
jobs:
  submit-private-kaggle-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ inputs.kaggle_profile || 'huhuukgghhuu' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Kaggle authorization without exposing credentials
        run: |
          test -n "$KAGGLE_API_TOKEN" || (echo "::error::Set KAGGLE_API_TOKEN in repository Actions secrets" && exit 1)
          test -n "$KAGGLE_USERNAME" || (echo "::error::Enter Kaggle username/profile URL in Run workflow, or set KAGGLE_USERNAME variable" && exit 1)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Kaggle CLI
        run: python -m pip install 'kaggle>=1.7.4'
      - name: Build PRIVATE GPU T4 Kaggle job
        run: |
          mkdir -p kaggle_job
          cp training/kaggle_gpu_pilot.py kaggle_job/maumgyeol_gpu.py
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          raw = os.environ["KAGGLE_USERNAME"].strip()
          # Accept bare usernames, @username and full profile URLs.
          username = raw.rstrip("/").split("/")[-1].lstrip("@")
          if not re.fullmatch(r"[A-Za-z0-9_-]{1,64}", username):
              raise SystemExit("Kaggle display name is not the account username. Copy username from https://www.kaggle.com/<username> and supply it as the workflow input kaggle_profile.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              print("KAGGLE_KERNEL_HANDLE=" + username + "/maumgyeol-kmi-gpu-pilot", file=env)
          print("Kaggle username format accepted", flush=True)
          metadata = {
            "id": f"{username}/maumgyeol-kmi-gpu-pilot",
            "title": "Maumgyeol KMI GPU Pilot",
            "code_file": "maumgyeol_gpu.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": True,
            "enable_gpu": True,
            "enable_internet": True,
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          Path("kaggle_job/kernel-metadata.json").write_text(json.dumps(metadata, indent=2))
          PY
      - name: Submit private GPU job to Kaggle
        run: |
          kaggle kernels push -p kaggle_job --accelerator NvidiaTeslaT4 --timeout 7200
          echo "Kaggle accepted the kernel submission; training status must be checked on Kaggle." >> "$GITHUB_STEP_SUMMARY"
          echo "Private Kaggle kernel submitted; see your account for private execution logs." >> "$GITHUB_STEP_SUMMARY"
          echo "Kaggle may deny GPU if the account is not eligible or has no quota." >> "$GITHUB_STEP_SUMMARY"
      - name: Track Kaggle training status until terminal result
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import time

          handle = os.environ["KAGGLE_KERNEL_HANDLE"]
          if not handle or handle.startswith("/"):
              sys.exit("Missing valid Kaggle kernel identifier")
          for attempt in range(115):
              cp = subprocess.run(
                  ["kaggle", "kernels", "status", handle],
                  text=True, capture_output=True
              )
              message = (cp.stdout + "\n" + cp.stderr).strip()
              match = re.search("KernelWorkerStatus[.]([A-Z_]+)", message)
              state = match.group(1) if match else "UNKNOWN"
              print(f"Kaggle status check {attempt + 1}: {state}", flush=True)
              if cp.returncode != 0 or state == "UNKNOWN":
                  sys.exit("Cannot read Kaggle status; refusing to poll indefinitely")
              if state == "COMPLETE":
                  print("Kaggle GPU run complete; verifying model outputs", flush=True)
                  sys.exit(0)
              if state in {"ERROR", "CANCEL_REQUESTED", "CANCEL_ACKNOWLEDGED"}:
                  sys.exit(f"Kaggle GPU run ended with {state}; inspect the private Kaggle Logs page")
              time.sleep(30)
          sys.exit("Kaggle GPU training not complete within monitoring deadline")
          PY
      - name: Download private experimental model outputs
        run: |
          mkdir -p kaggle_result
          kaggle kernels output "$KAGGLE_KERNEL_HANDLE" -p kaggle_result -o
          find kaggle_result -type f | head -40
          find kaggle_result -name adapter_model.safetensors -type f | grep -q .
          find kaggle_result -name training_manifest.json -type f | grep -q .
      - name: Save model as PRIVATE GitHub Actions artifact (never deploy)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maumgyeol-kaggle-gpu-experimental-NOT-SAFETY-APPROVED
          path: kaggle_result/
          if-no-files-found: error
          retention-days: 7
